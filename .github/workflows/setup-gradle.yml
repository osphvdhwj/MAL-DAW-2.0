name: Setup Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Gradle Wrapper JAR
        run: |
          echo "📦 Downloading Gradle wrapper JAR..."
          mkdir -p gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "✅ Gradle wrapper JAR downloaded successfully"
            ls -lh gradle/wrapper/gradle-wrapper.jar
          else
            echo "❌ Failed to download Gradle wrapper JAR"
            exit 1
          fi
      
      - name: Commit Gradle Wrapper JAR
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔧 Add Gradle wrapper JAR"
            git push
            echo "✅ Gradle wrapper JAR committed and pushed"
          fi

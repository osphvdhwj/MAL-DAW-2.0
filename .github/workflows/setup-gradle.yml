name: Setup Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          sudo mv gradle-8.2 /opt/gradle
          export PATH=/opt/gradle/bin:$PATH
      
      - name: Setup Gradle Wrapper
        run: |
          export PATH=/opt/gradle/bin:$PATH
          gradle wrapper --gradle-version 8.2
      
      - name: Verify Wrapper JAR
        run: |
          ls -la gradle/wrapper/
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "✅ Gradle wrapper JAR created successfully"
          else
            echo "❌ Gradle wrapper JAR not found"
            exit 1
          fi
      
      - name: Commit Gradle Wrapper
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          git add gradlew
          git add gradlew.bat
          git add gradle/wrapper/gradle-wrapper.properties
          git diff --staged --quiet || git commit -m "🔧 Add Gradle wrapper files"
          git push
